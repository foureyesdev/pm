services:
  app:
    build: .
    ports:
      - "127.0.0.1:${FIELDWORK_PORT:-8000}:8000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

volumes:
  data:
